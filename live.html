
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSLC Bihar - Live Classes</title>

<style>
:root {
  --bg: #101114;
  --card: #202127;
  --text: #ffffff;
  --muted: #aaa;
  --red: #ff3030;
  --border: #35363d;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  padding: 20px;
  min-height: 100vh;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
  padding-bottom: 20px;
  margin-bottom: 25px;
  border-bottom: 1px solid var(--border);
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo h1 {
  font-size: 23px;
}

.live-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: red;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  50% { opacity: .3; }
}

button {
  padding: 10px 16px;
  background: #292a30;
  color: white;
  border: 1px solid #444;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: #444;
}

.info {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 22px;
  color: var(--muted);
  font-size: 14px;
}

.live-label {
  color: #ff4444;
  font-weight: bold;
}

.streams-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 22px;
  max-width: 1600px;
  margin: auto;
}

.stream-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 9px;
  overflow: hidden;
}

.video-container {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: black;
}

.video-container iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

.card-details {
  padding: 15px;
}

.stream-title {
  font-size: 17px;
  font-weight: bold;
  margin-bottom: 12px;
}

.stream-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--muted);
}

.live-badge {
  color: white;
  background: #e52323;
  border-radius: 4px;
  padding: 5px 9px;
  font-size: 11px;
  font-weight: bold;
}

.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 65px 20px;
  background: var(--card);
  border-radius: 9px;
  color: var(--muted);
}

.empty-state h2 {
  color: white;
  margin-bottom: 12px;
}

footer {
  text-align: center;
  padding: 30px 10px;
  color: var(--muted);
  font-size: 13px;
}

@media(max-width: 750px) {
  .streams-grid {
    grid-template-columns: 1fr;
  }

  .logo h1 {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <span class="live-dot"></span>
    <h1>Bihar School Live Classes Portal</h1>
  </div>

  <button id="refreshBtn">↻ Refresh Live Classes</button>
</header>

<div class="info">
  <span class="live-label">● LIVE CLASS DASHBOARD</span>
  <span id="streamCount">Checking YouTube...</span>
</div>

<main class="streams-grid" id="streamsGrid">
  <div class="empty-state">
    Loading live classes...
  </div>
</main>

<footer>
  Bihar School Live Classes Portal<br><br>
  Powered by YouTube
</footer>

<script>

// ======================================
// CONFIGURATION
// ======================================

// Add your YouTube Data API v3 key here.
const API_KEY = "YOUR_YOUTUBE_API_KEY";

// BSLC Bihar channel handle
const CHANNEL_HANDLE = "BSLCBihar";

// Auto refresh interval: 60 seconds
const REFRESH_INTERVAL = 60000;

const grid = document.getElementById("streamsGrid");
const count = document.getElementById("streamCount");
const refreshBtn = document.getElementById("refreshBtn");

// ======================================
// GET CHANNEL ID
// ======================================

async function getChannelId() {

  const url = new URL(
    "https://www.googleapis.com/youtube/v3/channels"
  );

  url.search = new URLSearchParams({
    part: "id",
    forHandle: CHANNEL_HANDLE,
    key: API_KEY
  });

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("Unable to access YouTube channel.");
  }

  const data = await response.json();

  if (!data.items || data.items.length === 0) {
    throw new Error("BSLC Bihar channel not found.");
  }

  return data.items[0].id;
}

// ======================================
// FETCH ONLY CURRENTLY LIVE STREAMS
// ======================================

async function getLiveStreams(channelId) {

  const url = new URL(
    "https://www.googleapis.com/youtube/v3/search"
  );

  url.search = new URLSearchParams({
    part: "snippet",
    channelId: channelId,
    type: "video",
    eventType: "live",
    maxResults: "50",
    order: "viewCount",
    key: API_KEY
  });

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("Unable to fetch live streams.");
  }

  const data = await response.json();

  return data.items || [];
}

// ======================================
// DISPLAY LIVE STREAMS
// ======================================

function displayStreams(streams) {

  grid.replaceChildren();

  count.textContent =
    streams.length + " classes currently live";

  if (streams.length === 0) {

    const empty = document.createElement("div");
    empty.className = "empty-state";

    const heading = document.createElement("h2");
    heading.textContent = "No Live Classes Right Now";

    const message = document.createElement("p");
    message.textContent =
      "Please check again later for upcoming live classes.";

    empty.append(heading, message);
    grid.appendChild(empty);

    return;
  }

  streams.forEach(stream => {

    const videoId = stream.id.videoId;
    const titleText = stream.snippet.title;

    const card = document.createElement("div");
    card.className = "stream-card";

    // Video player
    const video = document.createElement("div");
    video.className = "video-container";

    const iframe = document.createElement("iframe");

    iframe.src =
      "https://www.youtube-nocookie.com/embed/" +
      encodeURIComponent(videoId);

    iframe.title = titleText;

    iframe.allow =
      "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";

    iframe.allowFullscreen = true;

    video.appendChild(iframe);

    // Details
    const details = document.createElement("div");
    details.className = "card-details";

    const title = document.createElement("div");
    title.className = "stream-title";
    title.textContent = titleText;

    const meta = document.createElement("div");
    meta.className = "stream-meta";

    const channel = document.createElement("span");
    channel.textContent = "BSLC Bihar";

    const badge = document.createElement("span");
    badge.className = "live-badge";
    badge.textContent = "● LIVE NOW";

    meta.append(channel, badge);

    details.append(title, meta);

    card.append(video, details);

    grid.appendChild(card);

  });
}

// ======================================
// MAIN FUNCTION
// ======================================

async function loadLiveClasses() {

  if (!API_KEY || API_KEY === "YOUR_YOUTUBE_API_KEY") {

    count.textContent = "API key required";

    grid.innerHTML = `
      <div class="empty-state">
        <h2>Setup Required</h2>
        <p>Please add your YouTube Data API key in the code.</p>
      </div>
    `;

    return;
  }

  refreshBtn.disabled = true;
  count.textContent = "Checking for live classes...";

  try {

    const channelId = await getChannelId();

    const streams = await getLiveStreams(channelId);

    displayStreams(streams);

  } catch (error) {

    console.error(error);

    grid.innerHTML = `
      <div class="empty-state">
        <h2>Unable to Load Live Classes</h2>
        <p>${error.message}</p>
        <p>Please check your API key and internet connection.</p>
      </div>
    `;

    count.textContent = "Connection error";

  } finally {

    refreshBtn.disabled = false;

  }
}

// ======================================
// REFRESH BUTTON
// ======================================

refreshBtn.addEventListener("click", loadLiveClasses);

// ======================================
// INITIALIZE AND AUTO REFRESH
// ======================================

loadLiveClasses();

setInterval(loadLiveClasses, REFRESH_INTERVAL);

</script>

</body>
</html>
