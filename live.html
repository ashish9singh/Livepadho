<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSLC Bihar - Live Stream Dashboard</title>
    <style>
        /* Modern CSS Variables & Reset */
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1f1f1f;
            --text-color: #ffffff;
            --accent-color: #ff0000;
            --accent-hover: #cc0000;
            --text-secondary: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
        }

        /* Header Styling */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }

        .logo-container h1 {
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-dot {
            width: 12px;
            height: 12px;
            background-color: var(--accent-color);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        .controls-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .controls-btn:hover {
            background-color: #333;
            border-color: var(--text-secondary);
        }

        /* Responsive Streams Grid */
        .streams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 500px) {
            .streams-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Stream Card Elements */
        .stream-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .card-details {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stream-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .stream-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .card-actions .controls-btn {
            flex: 1;
            text-align: center;
        }

        /* Cinema Mode State via JS */
        body.cinema-mode .streams-grid {
            grid-template-columns: 1fr;
            max-width: 1000px;
        }

        /* Keyframes */
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <h1><span class="live-dot"></span> Bihar School Live Classes Portal</h1>
        </div>
        <button class="controls-btn" id="toggleCinema">Toggle Large View</button>
    </header>

    <main class="streams-grid">
        <!-- Stream Card 1: Main Gateway (Fixed URL Format) -->
        <div class="stream-card" id="stream-bslc">
            <div class="video-container">
                <!-- Corrected URL structure to bypass connect errors -->
                <iframe 
                    id="bslc-iframe"
                    src="https://youtube.com" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
            <div class="card-details">
                <div class="stream-title">BSLC Live Broadcast Feed</div>
                <div class="stream-meta">
                    <span>Channel: @BSLCBihar</span>
                    <span>Status: Dynamic Live Tracking</span>
                </div>
                <div class="card-actions">
                    <button class="controls-btn" onclick="refreshStream('bslc-iframe')">🔄 Reload Player</button>
                </div>
            </div>
        </div>

        <!-- Secondary Slot Ready to use -->
        <div class="stream-card">
            <div class="video-container" style="background: #151515; display: flex; align-items: center; justify-content: center; min-height: 253px;">
               <p style="text-align:center; color: var(--text-secondary);">Secondary Slot Ready</p>
            </div>
            <div class="card-details">
                <div class="stream-title">Optional Backup Feed</div>
                <div class="stream-meta">
                    <span>No channel mapped</span>
                    <span>Status: Idle</span>
                </div>
                <div class="card-actions">
                    <button class="controls-btn" disabled>No Action</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Toggle Layout View (Cinema vs Grid View)
        const toggleBtn = document.getElementById('toggleCinema');
        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('cinema-mode');
            toggleBtn.textContent = document.body.classList.contains('cinema-mode') 
                ? "Toggle Grid View" 
                : "Toggle Large View";
        });

        // Force reload the iframe element to pick up newly started streams
        function refreshStream(iframeId) {
            const iframe = document.getElementById(iframeId);
            if (iframe) {
                const currentSrc = iframe.src;
                iframe.src = ''; // Clear source
                iframe.src = currentSrc; // Re-assign to force refresh connection
            }
        }
    </script>
</body>
</html>
