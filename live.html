
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BSLC Bihar - Live Classes Dashboard</title>

<style>
:root {
    --bg: #101010;
    --card: #202020;
    --text: #ffffff;
    --muted: #aaaaaa;
    --red: #ff3030;
    --border: #353535;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    min-height: 100vh;
}

/* HEADER */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    padding-bottom: 20px;
    margin-bottom: 25px;
    border-bottom: 1px solid var(--border);
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo h1 {
    font-size: 22px;
}

.live-dot {
    width: 12px;
    height: 12px;
    background: red;
    border-radius: 50%;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    50% { opacity: .35; }
}

.header-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    cursor: pointer;
    border: 1px solid #444;
    border-radius: 5px;
    padding: 10px 15px;
    color: white;
    background: #292929;
    transition: .2s;
}

button:hover {
    background: #444;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

/* DASHBOARD INFO */

.dashboard-info {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
    color: var(--muted);
    font-size: 14px;
}

.live-label {
    color: #ff4444;
    font-weight: bold;
}

/* VIDEO GRID */

.streams-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px;
    max-width: 1600px;
    margin: auto;
}

.stream-card {
    background: var(--card);
    border-radius: 9px;
    overflow: hidden;
    border: 1px solid var(--border);
}

.video-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
}

.video-container iframe {
    position: absolute;
    width: 100%;
    height: 100%;
    border: none;
    top: 0;
    left: 0;
}

.card-details {
    padding: 15px;
}

.stream-title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 9px;
}

.stream-meta {
    color: var(--muted);
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 5px;
}

.card-actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.card-actions button {
    flex: 1;
}

/* EMPTY STATE */

.empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    background: var(--card);
    border-radius: 8px;
}

/* CINEMA MODE */

body.cinema-mode .streams-grid {
    grid-template-columns: 1fr;
    max-width: 1100px;
}

/* RESPONSIVE */

@media (max-width: 750px) {
    .streams-grid {
        grid-template-columns: 1fr;
    }

    header {
        align-items: flex-start;
    }

    .logo h1 {
        font-size: 18px;
    }
}

footer {
    text-align: center;
    margin-top: 40px;
    padding: 20px;
    color: var(--muted);
    font-size: 13px;
}
</style>
</head>

<body>

<header>

    <div class="logo">
        <span class="live-dot"></span>
        <h1>Bihar School Live Classes Portal</h1>
    </div>

    <div class="header-actions">
        <button id="cinemaBtn">
            Toggle Large View
        </button>

        <button id="refreshAllBtn">
            ↻ Refresh All
        </button>
    </div>

</header>

<div class="dashboard-info">
    <span class="live-label">● LIVE CLASS DASHBOARD</span>
    <span id="streamCount">Loading streams...</span>
</div>

<main class="streams-grid" id="streamsGrid">

</main>

<footer>
    Bihar School Live Classes Portal
    <br><br>
    Powered by YouTube
</footer>

<script>

/* =====================================
   CONFIGURATION: ADD YOUR LIVE STREAMS
===================================== */

const streams = [

    {
        title: "BSLC Live Class - Channel 1",
        channel: "@BSLCBihar",
        videoId: "PASTE_VIDEO_ID_1"
    },

    {
        title: "BSLC Live Class - Channel 2",
        channel: "BSLC Bihar",
        videoId: "PASTE_VIDEO_ID_2"
    },

    {
        title: "BSLC Live Class - Channel 3",
        channel: "BSLC Bihar",
        videoId: "PASTE_VIDEO_ID_3"
    },

    {
        title: "BSLC Live Class - Channel 4",
        channel: "BSLC Bihar",
        videoId: "PASTE_VIDEO_ID_4"
    }

];


/* =====================================
   GENERATE VIDEO CARDS
===================================== */

const grid = document.getElementById("streamsGrid");

function createStreamCard(stream, index) {

    const card = document.createElement("div");
    card.className = "stream-card";

    const validId = /^[a-zA-Z0-9_-]{11}$/.test(stream.videoId);

    const videoContainer = document.createElement("div");
    videoContainer.className = "video-container";

    if (validId) {

        const iframe = document.createElement("iframe");

        iframe.id = "player-" + index;

        iframe.src =
            "https://www.youtube-nocookie.com/embed/" +
            encodeURIComponent(stream.videoId) +
            "?rel=0";

        iframe.title = stream.title;
        iframe.allow =
            "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";

        iframe.allowFullscreen = true;

        videoContainer.appendChild(iframe);

    } else {

        videoContainer.style.display = "flex";
        videoContainer.style.alignItems = "center";
        videoContainer.style.justifyContent = "center";
        videoContainer.style.color = "#aaa";

        videoContainer.textContent =
            "Add a valid YouTube Video ID to activate this stream.";

    }

    const details = document.createElement("div");
    details.className = "card-details";

    const title = document.createElement("div");
    title.className = "stream-title";
    title.textContent = stream.title;

    const meta = document.createElement("div");
    meta.className = "stream-meta";

    const channel = document.createElement("span");
    channel.textContent = "Channel: " + stream.channel;

    const status = document.createElement("span");
    status.textContent = validId ? "Player Ready" : "Not Configured";

    meta.appendChild(channel);
    meta.appendChild(status);

    const actions = document.createElement("div");
    actions.className = "card-actions";

    const reloadBtn = document.createElement("button");
    reloadBtn.textContent = "↻ Reload Player";
    reloadBtn.disabled = !validId;

    reloadBtn.addEventListener("click", () => {
        reloadStream(index);
    });

    const openBtn = document.createElement("button");
    openBtn.textContent = "Open on YouTube";
    openBtn.disabled = !validId;

    openBtn.addEventListener("click", () => {
        window.open(
            "https://www.youtube.com/watch?v=" +
            encodeURIComponent(stream.videoId),
            "_blank",
            "noopener"
        );
    });

    actions.appendChild(reloadBtn);
    actions.appendChild(openBtn);

    details.appendChild(title);
    details.appendChild(meta);
    details.appendChild(actions);

    card.appendChild(videoContainer);
    card.appendChild(details);

    return card;
}


/* =====================================
   LOAD ALL STREAMS
===================================== */

function loadStreams() {

    grid.replaceChildren();

    const validStreams = streams.filter(stream =>
        /^[a-zA-Z0-9_-]{11}$/.test(stream.videoId)
    );

    document.getElementById("streamCount").textContent =
        validStreams.length + " configured streams / " +
        streams.length + " total slots";

    if (streams.length === 0) {

        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "No streams configured yet.";

        grid.appendChild(empty);
        return;
    }

    streams.forEach((stream, index) => {
        grid.appendChild(createStreamCard(stream, index));
    });
}


/* =====================================
   RELOAD INDIVIDUAL PLAYER
===================================== */

function reloadStream(index) {

    const iframe = document.getElementById("player-" + index);

    if (iframe) {

        const originalSrc = iframe.src;

        iframe.src = "about:blank";

        setTimeout(() => {
            iframe.src = originalSrc;
        }, 100);
    }
}


/* =====================================
   REFRESH ALL PLAYERS
===================================== */

document.getElementById("refreshAllBtn")
.addEventListener("click", () => {

    streams.forEach((stream, index) => {

        if (/^[a-zA-Z0-9_-]{11}$/.test(stream.videoId)) {
            reloadStream(index);
        }

    });

});


/* =====================================
   CINEMA MODE
===================================== */

const cinemaBtn = document.getElementById("cinemaBtn");

cinemaBtn.addEventListener("click", () => {

    document.body.classList.toggle("cinema-mode");

    cinemaBtn.textContent =
        document.body.classList.contains("cinema-mode")
        ? "Toggle Grid View"
        : "Toggle Large View";

});


/* =====================================
   INITIALIZE
===================================== */

loadStreams();

</script>

</body>
</html>
